<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkScout</title>
    <!--
      JetBrains Mono from Google Fonts — monospace with a clean, technical character.
      The preconnect hints tell the browser to open the connection early so the font
      loads faster when the stylesheet is eventually parsed.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      React mounts the entire app into this single <div>.
      "Mounting" means React takes over this element and manages everything inside it.
      You almost never touch index.html after initial setup.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
